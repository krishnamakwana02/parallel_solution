<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- =========================
       FAVICON
  ========================== -->
  <link
    rel="icon"
    type="image/png"
    href="%PUBLIC_URL%/favicon.png"
  />

  <link
    rel="apple-touch-icon"
    href="%PUBLIC_URL%/favicon.png"
  />

  <!-- =========================
       VIEWPORT
  ========================== -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <!-- =========================
       PRIMARY SEO
  ========================== -->
  <title>
    Parallel Solutions | Content, Advertising & Marketing Studio
  </title>

  <meta
    name="description"
    content="Parallel Solutions is a content, advertising and marketing studio helping brands move forward through strategy, creative content, campaigns and performance marketing."
  />

  <meta
    name="keywords"
    content="Parallel Solutions, marketing agency, advertising agency, content studio, digital marketing, creative agency, branding, performance marketing, social media marketing, content marketing, advertising agency India"
  />

  <meta name="author" content="Parallel Solutions" />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta
    name="googlebot"
    content="index, follow"
  />

  <!-- =========================
       CANONICAL
  ========================== -->
  <link
    rel="canonical"
    href="https://www.yourdomain.com/"
  />

  <!-- =========================
       THEME
  ========================== -->
  <meta
    name="theme-color"
    content="#101b3c"
  />

  <meta
    name="msapplication-TileColor"
    content="#101b3c"
  />

  <!-- =========================
       OPEN GRAPH / FACEBOOK
  ========================== -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Parallel Solutions | Content, Advertising & Marketing Studio"
  />

  <meta
    property="og:description"
    content="A content, advertising and marketing studio built to run strategy, creative and media as one force."
  />

  <meta
    property="og:url"
    content="https://www.yourdomain.com/"
  />

  <meta
    property="og:site_name"
    content="Parallel Solutions"
  />

  <meta
    property="og:locale"
    content="en_IN"
  />

  <!-- Replace with your actual social preview image -->
  <meta
    property="og:image"
    content="https://www.yourdomain.com/og-image.jpg"
  />

  <meta
    property="og:image:alt"
    content="Parallel Solutions - Content, Advertising and Marketing"
  />

  <!-- =========================
       TWITTER / X
  ========================== -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Parallel Solutions | Content, Advertising & Marketing Studio"
  />

  <meta
    name="twitter:description"
    content="Content, advertising and marketing built to move brands forward."
  />

  <meta
    name="twitter:image"
    content="https://www.yourdomain.com/og-image.jpg"
  />

  <!-- =========================
       STRUCTURED DATA
       ORGANIZATION
  ========================== -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Parallel Solutions",
      "url": "https://www.yourdomain.com/",
      "logo": "https://www.yourdomain.com/favicon.png",
      "description": "Content, advertising and marketing studio helping brands move forward through strategy, creative content, campaigns and performance marketing.",
      "areaServed": "Worldwide",
      "knowsAbout": [
        "Content Marketing",
        "Advertising",
        "Digital Marketing",
        "Brand Strategy",
        "Creative Campaigns",
        "Performance Marketing",
        "Social Media Marketing"
      ]
    }
  </script>

  <!-- =========================
       WEBSITE STRUCTURED DATA
  ========================== -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Parallel Solutions",
      "url": "https://www.yourdomain.com/"
    }
  </script>

  <!-- =========================
       GOOGLE FONTS
  ========================== -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- =========================
       MANIFEST
  ========================== -->
  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

</head>

<body>

  <noscript>
    You need to enable JavaScript to run this website.
  </noscript>

  <div id="root"></div>

</body>

</html>
